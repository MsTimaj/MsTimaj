<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mstimaj. I build AI systems and run them in production, then explain them in plain language.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ed"/>
      <stop offset="60%" stop-color="#efece4"/>
      <stop offset="100%" stop-color="#e4ebe1"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#659675" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#7ee0a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#a75332" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="20%" stop-color="#153d32"/>
      <stop offset="70%" stop-color="#659675"/>
      <stop offset="100%" stop-color="#a75332"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- A retrieval pipeline. It is what she builds, used as the ornament. -->
  <g opacity=".62">
    <g stroke="#d1d6cc" stroke-width="2" fill="none">
      <path d="M764 150 H788"/><path d="M892 150 H916"/><path d="M1020 150 H1044"/>
    </g>
    <g stroke="#659675" stroke-width="2" fill="none" stroke-dasharray="7 11">
      <path d="M764 150 H788">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M892 150 H916">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" begin="-.53s" repeatCount="indefinite"/>
      </path>
      <path d="M1020 150 H1044">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" begin="-1.06s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#fffdf8" stroke="#c6cfc4" stroke-width="2">
      <rect x="660" y="117" width="104" height="66" rx="11"/>
      <rect x="788" y="117" width="104" height="66" rx="11"/>
      <rect x="916" y="117" width="104" height="66" rx="11"/>
      <rect x="1044" y="117" width="104" height="66" rx="11"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500" fill="#3f6b53" text-anchor="middle">
      <text x="712" y="155">ask</text>
      <text x="840" y="155">retrieve</text>
      <text x="968" y="155">rank</text>
      <text x="1096" y="155">answer</text>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="80" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="url(#ink)" letter-spacing="-1.5">Mstimaj</text>

  <text x="82" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#18241e" opacity=".80">I build AI systems and run them in production,</text>
  <text x="82" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#18241e" opacity=".80">then explain them in plain language.</text>

  <text x="82" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3f6b53" letter-spacing="2.4">FATIMA JALLOH &#183; CONNECTICUT</text>

  <rect x="80" y="58" width="44" height="2" fill="#659675" opacity=".85"/>
</svg>
